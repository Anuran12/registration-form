<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Thank you for registering with CINI." />
    <meta name="theme-color" content="#f6f1e8" />
    <title>Thank You | CINI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body class="thank-you-page">
    <header class="success-header">
      <a class="success-brand" href="index.html#top" aria-label="CINI registration home">
        <img src="assets/cini-logo.png" alt="CINI" />
      </a>
    </header>
    <main class="thank-you-main">
      <section class="thank-you-panel" aria-labelledby="thank-you-title">
        <div class="success-mark" aria-hidden="true">&#10003;</div>
        <p class="section-kicker">CINI registration</p>
        <h1 id="thank-you-title">Thank You for Registering!</h1>
        <p>Your registration has been successfully submitted.</p>
        <div class="completion-card"><span aria-hidden="true">&#10003;</span><strong>Registration successfully completed</strong></div>
        <p class="thank-you-support">We look forward to your participation.</p>
        <a class="submit-button thank-you-button" href="index.html#top">Back to Registration</a>
      </section>
    </main>
    <footer class="site-footer"><div class="shell"><span>CINI: Child In Need Institute</span></div></footer>
  </body>
</html>
